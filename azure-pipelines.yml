trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
- name: azureSubscription
  value: 'EANDI-SSP-DEV-RG'

- name: webAppName
  value: 'eni-ssp-backend-dev'

- name: resourceGroupName
  value: 'DevResourceGroup-SSP-EUS'

- name: workingDirectory
  value: '.'

- group: eni-ssp-backend-dev

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '22.x'
  displayName: 'Install Node.js 22'

- script: |
    set -e
    cd $(workingDirectory)
    npm ci
    if npm run | grep -qE ' build'; then
      npm run build
    else
      echo "No build script found, skipping build."
    fi
  displayName: 'Install dependencies and build (if applicable)'

- task: ArchiveFiles@2
  inputs:
    rootFolderOrFile: '$(workingDirectory)'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)/backend.zip'
    replaceExistingArchive: true
    verbose: true
    excludePatterns: |
      **/node_modules/**
      **/.git/**
      **/.github/**
  displayName: 'Archive backend as ZIP'

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)/backend.zip'
    ArtifactName: 'backend'
    publishLocation: 'Container'
  displayName: 'Publish backend artifact'

- task: AzureCLI@2
  displayName: 'Apply App Settings (env vars) to Backend Web App'
  inputs:
    azureSubscription: '$(azureSubscription)'
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      set -e

      az webapp config appsettings set \
        --resource-group "$(resourceGroupName)" \
        --name "$(webAppName)" \
        --settings \
          NODE_ENV="$NODE_ENV" \
          PORT="$PORT" \
          JWT_SECRET="$JWT_SECRET" \
          JWT_EXPIRES_IN="$JWT_EXPIRES_IN" \
          SAML_ISSUER="$SAML_ISSUER" \
          SAML_CALLBACK_URL="$SAML_CALLBACK_URL" \
          OKTA_SIGNON_URL="$OKTA_SIGNON_URL" \
          OKTA_SSO_URL="$OKTA_SSO_URL" \
          OKTA_METADATA_URL="$OKTA_METADATA_URL" \
          OKTA_X509_CERT_B64="$OKTA_X509_CERT_B64" \
          FRONTEND_SUCCESS_REDIRECT="$FRONTEND_SUCCESS_REDIRECT" \
          CORS_ORIGIN="$CORS_ORIGIN" \
          FRONTEND_BASE_URL="$FRONTEND_BASE_URL" \
          SESSION_SECRET="$SESSION_SECRET" \
          DATABASE_URL="$DATABASE_URL" \
          DB_SERVER="$DB_SERVER" \
          DB_USER="$DB_USER" \
          DB_PASSWORD="$DB_PASSWORD" \
          DB_NAME="$DB_NAME" \
          DB_PORT="$DB_PORT" \
          AZURE_STORAGE_CONNECTION_STRING="$AZURE_STORAGE_CONNECTION_STRING" \
          AZURE_DOWNLOAD_CONTAINERS="$AZURE_DOWNLOAD_CONTAINERS" \
          MAIL_USER="$MAIL_USER" \
          MAIL_PASS="$MAIL_PASS" \
          MAIL_HOST="$MAIL_HOST" \
          MAIL_PORT="$MAIL_PORT" \
          NOTIFY_TO="$NOTIFY_TO" \
          PIPELINE_TRIGGER_URL="$PIPELINE_TRIGGER_URL"

      echo "✅ App settings applied."

      # Optional cleanup (prevents old cert env vars from conflicting)
      az webapp config appsettings delete \
        --resource-group "$(resourceGroupName)" \
        --name "$(webAppName)" \
        --setting-names OKTA_X509_CERT OKTA_X509_CERT_PEM || true

      echo "✅ Old cert settings removed (if they existed)."
  env:
    NODE_ENV: $(NODE_ENV)
    PORT: $(PORT)
    JWT_SECRET: $(JWT_SECRET)
    JWT_EXPIRES_IN: $(JWT_EXPIRES_IN)
    SAML_ISSUER: $(SAML_ISSUER)
    SAML_CALLBACK_URL: $(SAML_CALLBACK_URL)
    OKTA_SIGNON_URL: $(OKTA_SIGNON_URL)
    OKTA_SSO_URL: $(OKTA_SSO_URL)
    OKTA_METADATA_URL: $(OKTA_METADATA_URL)
    OKTA_X509_CERT_B64: $(OKTA_X509_CERT_B64)
    FRONTEND_SUCCESS_REDIRECT: $(FRONTEND_SUCCESS_REDIRECT)
    CORS_ORIGIN: $(CORS_ORIGIN)
    FRONTEND_BASE_URL: $(FRONTEND_BASE_URL)
    SESSION_SECRET: $(SESSION_SECRET)
    DATABASE_URL: $(DATABASE_URL)
    DB_SERVER: $(DB_SERVER)
    DB_USER: $(DB_USER)
    DB_PASSWORD: $(DB_PASSWORD)
    DB_NAME: $(DB_NAME)
    DB_PORT: $(DB_PORT)
    AZURE_STORAGE_CONNECTION_STRING: $(AZURE_STORAGE_CONNECTION_STRING)
    AZURE_DOWNLOAD_CONTAINERS: $(AZURE_DOWNLOAD_CONTAINERS)
    MAIL_USER: $(MAIL_USER)
    MAIL_PASS: $(MAIL_PASS)
    MAIL_HOST: $(MAIL_HOST)
    MAIL_PORT: $(MAIL_PORT)
    NOTIFY_TO: $(NOTIFY_TO)
    PIPELINE_TRIGGER_URL: $(PIPELINE_TRIGGER_URL)

- task: AzureWebApp@1
  displayName: 'Deploy backend.zip to Azure Web App'
  inputs:
    azureSubscription: '$(azureSubscription)'
    appName: '$(webAppName)'
    package: '$(Build.ArtifactStagingDirectory)/backend.zip'
